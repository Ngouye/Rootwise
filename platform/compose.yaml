name: cryptoplatform

# Toutes les données vivent chez Supabase : la base PostgreSQL (DB_URL, DB_USER, DB_PASSWORD) et les
# fichiers dans Supabase Storage (S3_ENDPOINT, S3_ACCESS_KEY, S3_SECRET_KEY), voir infra/supabase.
# Rien n'est stocké sur la machine.
#
# Développement :      docker compose up -d                 -> Mailpit (boîte mail de test)
# Tout en conteneurs : docker compose --profile app up -d --build
# Hors ligne :         ajouter --profile local (PostgreSQL et SeaweedFS locaux) et vider DB_URL,
#                      S3_ENDPOINT, S3_ACCESS_KEY et S3_SECRET_KEY dans .env.
# Les ports ne sont ouverts que sur 127.0.0.1 (pas d'exposition au réseau local).

services:
  mailpit: # boîte mail de test pour la vérification d'e-mail : http://localhost:8025
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports: ["127.0.0.1:1025:1025", "127.0.0.1:8025:8025"]

  api:
    profiles: ["app"]
    build: ./api
    # Relancée si Supabase est momentanément injoignable (réseau pas encore prêt au démarrage, etc.).
    restart: unless-stopped
    environment:
      # Supabase si les valeurs sont renseignées dans .env, sinon les services du profil « local ».
      DB_URL: ${DB_URL:-jdbc:postgresql://postgres:5432/cryptoplatform}
      DB_USER: ${DB_USER:-cryptoplatform}
      DB_PASSWORD: ${DB_PASSWORD:-${LOCAL_DB_PASSWORD:-cryptoplatform}}
      DB_SCHEMA: ${DB_SCHEMA:-app}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-10}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://seaweedfs:8333}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-cryptoplatform}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-cryptoplatform-dev-secret}
      S3_BUCKET: ${S3_BUCKET:-cryptoplatform-media}
      STORAGE_MAX_VIDEO: ${STORAGE_MAX_VIDEO:-1GB}
      MAIL_HOST: mailpit
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-http://localhost:3000}
      JWT_SECRET: ${JWT_SECRET:-}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      CERT_SIGNING_KEY: ${CERT_SIGNING_KEY:-}
      DEMO_DATA: ${DEMO_DATA:-false}
    depends_on: # services locaux absents quand tout est chez Supabase
      postgres: { condition: service_healthy, required: false }
      seaweedfs: { condition: service_started, required: false }
    ports: ["127.0.0.1:8080:8080"]

  web:
    profiles: ["app"]
    build:
      context: ./web
      args:
        API_URL: http://api:8080 # les rewrites Next.js sont figés au build
    environment:
      API_URL: http://api:8080
    depends_on: [api]
    restart: unless-stopped
    ports: ["127.0.0.1:3000:3000"]

  # ───── Hors ligne uniquement (profil « local ») ─────
  postgres:
    profiles: ["local"]
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: cryptoplatform
      POSTGRES_USER: cryptoplatform
      POSTGRES_PASSWORD: ${LOCAL_DB_PASSWORD:-cryptoplatform}
    ports: ["127.0.0.1:5432:5432"]
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  seaweedfs: # stockage compatible S3 (identifiants : infra/seaweedfs/s3.json)
    profiles: ["local"]
    image: chrislusf/seaweedfs:4.48
    command: ["server", "-dir=/data", "-s3", "-s3.config=/etc/seaweedfs/s3.json", "-master.volumeSizeLimitMB=1024"]
    ports: ["127.0.0.1:8333:8333"]
    volumes:
      - seaweedfs-data:/data
      - ./infra/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro

volumes:
  postgres-data:
  seaweedfs-data:
